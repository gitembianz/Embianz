on: push
name: Deploy Dev to dev.dormisoft.md on push
jobs:
  web-deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v3
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ftp.dormisoft.md  
        username: gituser@dormisoft.md
        password: ${{ secrets.mainftpds}}
