on: push
name: Deploy Dev to dev.embianz.com on push
jobs:
  web-deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4
    
    - name: 📂 Sync files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ftp.eztemcorp.com
        username: gituser@dev.embianz.com
        password: ${{ secrets.devftp}}
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/vendor*/**
          .env